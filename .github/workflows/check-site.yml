# בדיקת תקינות אוטומטית — רצה בכל העלאה של index.html.
# אם משהו נשבר, GitHub שולח מייל לבעל המאגר, וברשימת ה-Actions מופיע ❌ עם פירוט הבעיות.
name: בדיקת תקינות האתר
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/scripts/check-site.js']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: התקנת דפדפן לבדיקה
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: בדיקת האתר (מחשב + נייד)
        run: node .github/scripts/check-site.js index.html
